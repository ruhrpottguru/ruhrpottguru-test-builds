name: PottFuchs P0 One-time SEO Migration QA
on:
  push:
    branches:
      - release/pottfuchs-p0-seo-owner-migration-1.0.0
    paths:
      - 'releases/pottfuchs-p0-bestandsmigration/**'
      - '.github/workflows/pottfuchs-p0-migration-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: PHP interpreter
        run: php -v
      - name: PHP lint plugin and tests
        run: |
          php -l releases/pottfuchs-p0-bestandsmigration/pottfuchs-p0-bestandsmigration.php
          php -l releases/pottfuchs-p0-bestandsmigration/tests/test-pottfuchs-p0.php
      - name: Real archived-Places-source integration and rollback tests
        run: |
          php releases/pottfuchs-p0-bestandsmigration/tests/test-pottfuchs-p0.php wordpress/plugins/ruhrpott-guru-places/ruhrpott-guru-places.php
      - name: Build genuine installable WordPress Plugin ZIP
        run: |
          mkdir -p dist/staging/pottfuchs-p0-bestandsmigration dist/release
          cp releases/pottfuchs-p0-bestandsmigration/pottfuchs-p0-bestandsmigration.php dist/staging/pottfuchs-p0-bestandsmigration/
          cp releases/pottfuchs-p0-bestandsmigration/README.txt dist/staging/pottfuchs-p0-bestandsmigration/
          (cd dist/staging && zip -qr ../release/PottFuchs-P0-SEO-Bestandsmigration-v1.0.0.zip pottfuchs-p0-bestandsmigration)
          unzip -t dist/release/PottFuchs-P0-SEO-Bestandsmigration-v1.0.0.zip
          sha256sum dist/release/PottFuchs-P0-SEO-Bestandsmigration-v1.0.0.zip | tee dist/release/PottFuchs-P0-SEO-Bestandsmigration-v1.0.0.zip.sha256
      - name: Archive ZIP and SHA as CI candidate, not a live-installed release
        uses: actions/upload-artifact@v4
        with:
          name: pottfuchs-p0-seo-migration-v1.0.0-candidate
          path: dist/release/
          retention-days: 90
          if-no-files-found: error
      - name: Archive tested candidate as GitHub prerelease (not live-approved)
        if: github.ref == 'refs/heads/release/pottfuchs-p0-seo-owner-migration-1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pottfuchs-p0-seo-migration-v1.0.0-rc1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Prerelease exists; preserving previously verified artifacts."
          else
            gh release create "$TAG" \
              dist/release/PottFuchs-P0-SEO-Bestandsmigration-v1.0.0.zip \
              dist/release/PottFuchs-P0-SEO-Bestandsmigration-v1.0.0.zip.sha256 \
              --target "$GITHUB_SHA" --prerelease \
              --title "PottFuchs P0 SEO Migration 1.0.0 (candidate only)" \
              --notes "TESTED INSTALLABLE CANDIDATE ONLY. CI tests use archived Places v1.10.169 as fixture with simulated 1.10.185 version header; the actual installed v1.10.185 owner source was NOT available for regression. Activation has strict signature/version preflight and backup/rollback but a safe live outcome is unverified. NOT INSTALLED AND NOT P0 COMPLETE. No production change by CI."
          fi
