name: Android v0.16.1 test APK
on:
  workflow_dispatch:
  push:
    branches: [android-v0.16.1-build]
    paths: ['android-source.zip', '.github/workflows/android-v0161.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Extract Android source
        run: |
          test -s android-source.zip || { echo "Missing android-source.zip"; exit 1; }
          mkdir android
          unzip -q android-source.zip -d android
          test -f android/app/build.gradle
      - name: Restore existing test signing key
        env:
          TEST_KEYSTORE_B64: ${{ secrets.RPG_ANDROID_TEST_KEYSTORE_B64 }}
        run: |
          test -n "$TEST_KEYSTORE_B64" || { echo "Missing RPG_ANDROID_TEST_KEYSTORE_B64 secret"; exit 1; }
          mkdir -p android/signing
          printf '%s' "$TEST_KEYSTORE_B64" | base64 -d > android/signing/test-debug.jks
          chmod 600 android/signing/test-debug.jks
          grep -q "versionName '0.16.1-test'" android/app/build.gradle
      - name: Build and unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: RuhrpottGuru-0.16.1-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
