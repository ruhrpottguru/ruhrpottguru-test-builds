name: PottFuchs P0 Focused Direct Details (read-only)
on:
  push:
    paths:
      - 'tools/pottfuchs_p0_detail_e2e.js'
      - '.github/workflows/pottfuchs-p0-focused-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral Playwright (runner only)
        run: npm install --prefix "$RUNNER_TEMP/pf-browser" --no-audit --no-fund playwright@1.56.0
      - name: Install ephemeral Chromium (runner only)
        run: |
          "$RUNNER_TEMP/pf-browser/node_modules/.bin/playwright" install chromium
      - name: P0 direct entry and overlay regression
        run: NODE_PATH="$RUNNER_TEMP/pf-browser/node_modules" node tools/pottfuchs_p0_detail_e2e.js
      - name: Archive P0 browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pottfuchs-p0-focus
          path: audit/p0-detail/
          retention-days: 30
          if-no-files-found: warn
