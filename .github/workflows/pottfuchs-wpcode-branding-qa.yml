name: PottFuchs WPCode branding patch (offline, safe)
on:
  push:
    branches:
      - pottfuchs-wpcode-branding-readonly-20261026
    paths:
      - 'tools/pottfuchs_wpcode_branding_offline.py'
      - 'tests/test_pottfuchs_wpcode_branding_offline.py'
      - '.github/workflows/pottfuchs-wpcode-branding-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branding-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-owner patch and reverse diff tests (no network, no WP writes)
        run: python -m unittest discover -s tests -p 'test_pottfuchs_wpcode_branding_offline.py' -v
      - name: Syntax compile
        run: python -m py_compile tools/pottfuchs_wpcode_branding_offline.py
