name: PottFuchs P0 Direct Details and Overlay E2E (read-only)
on:
  push:
    paths:
      - 'tools/pottfuchs_p0_detail_e2e.js'
      - '.github/workflows/pottfuchs-p0-detail-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check tools/pottfuchs_p0_detail_e2e.js
      - name: Prepare ephemeral Playwright
        run: npm install --prefix "$RUNNER_TEMP/pf-browser" --no-audit --no-fund playwright@1.56.0
      - name: Install isolated Chromium
        run: |\n          "$RUNNER_TEMP/pf-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Execute P0 read-only browser regression
        run: NODE_PATH="$RUNNER_TEMP/pf-browser/node_modules" node tools/pottfuchs_p0_detail_e2e.js
      - name: Archive P0 results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pottfuchs-p0-detail-e2e
          path: audit/p0-detail/
          retention-days: 30
          if-no-files-found: warn
