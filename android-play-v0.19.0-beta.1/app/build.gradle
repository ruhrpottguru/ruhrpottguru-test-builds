plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
// Explicit opt-in keeps existing APK updates on their original package/key.
def playStoreBuild = providers.gradleProperty('playStore').map { it.toBoolean() }.getOrElse(false)
def playSigning = ['RPG_UPLOAD_STORE_FILE', 'RPG_UPLOAD_STORE_PASSWORD', 'RPG_UPLOAD_KEY_ALIAS', 'RPG_UPLOAD_KEY_PASSWORD'].collectEntries { [(it): System.getenv(it)] }
if (playStoreBuild && playSigning.values().any { !it }) {
 throw new GradleException('Play build requires the private RPG_UPLOAD_* signing environment variables.')
}
android {
 namespace 'de.ruhrpottguru.testapp'
 compileSdk 36
 buildToolsVersion '36.0.0'
 defaultConfig { applicationId (playStoreBuild ? 'de.ruhrpottguru.app' : 'de.ruhrpottguru.testapp'); minSdk 26; targetSdk 36; versionCode (playStoreBuild ? 25 : 24); versionName (playStoreBuild ? '0.19.0-beta.1' : '0.19.0-test'); manifestPlaceholders = [appLabel: playStoreBuild ? 'RuhrpottGuru' : 'RuhrpottGuru Test'] }
 sourceSets { test.resources.srcDir('src/main/assets/quiz') }
 buildFeatures { compose true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 signingConfigs {
  debug { storeFile file('../signing/test-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
  if (playStoreBuild) {
   playUpload {
    storeFile file(playSigning.RPG_UPLOAD_STORE_FILE)
    storePassword playSigning.RPG_UPLOAD_STORE_PASSWORD
    keyAlias playSigning.RPG_UPLOAD_KEY_ALIAS
    keyPassword playSigning.RPG_UPLOAD_KEY_PASSWORD
   }
  }
 }
 // Existing direct APKs retain their test identity; Play uses a separate upload key.
 buildTypes { release {
  debuggable false
  signingConfig (playStoreBuild ? signingConfigs.playUpload : signingConfigs.debug)
  minifyEnabled true
  shrinkResources true
  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
 } }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2025.04.01')
 implementation 'androidx.activity:activity-compose:1.10.1'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.foundation:foundation'
 implementation 'androidx.work:work-runtime:2.10.1'
 implementation 'io.coil-kt.coil3:coil-compose:3.1.0'
 implementation 'io.coil-kt.coil3:coil-network-okhttp:3.1.0'
 implementation 'io.coil-kt.coil3:coil-svg:3.1.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
