    <path d="M 10.5 15 L 21.5 24" stroke="#fbbf24" stroke-width="1.2" opacity="0.8" />
    <path d="M 21.5 15 L 10.5 24" stroke="#fbbf24" stroke-width="1.2" opacity="0.8" />
    <!-- Winding wheels -->
    <circle cx="12" cy="6" r="3.5" stroke="#fbbf24" fill="rgba(245, 158, 11, 0.25)" stroke-width="1.8" />
    <circle cx="20" cy="6" r="3.5" stroke="#fbbf24" fill="rgba(245, 158, 11, 0.25)" stroke-width="1.8" />
    <circle cx="12" cy="6" r="1" fill="#fbbf24" stroke="none" />
    <circle cx="20" cy="6" r="1" fill="#fbbf24" stroke="none" />
    <!-- Base line -->
    <path d="M 3 33 L 31 33" stroke="#f59e0b" stroke-width="2.2" />
