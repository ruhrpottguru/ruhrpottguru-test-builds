<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="0" y="0" width="64" height="64" rx="16" fill="#090d16" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" />
  <g transform="translate(16, 14)" stroke-linecap="round" stroke-linejoin="round">
