plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
 namespace 'de.ruhrpottguru.testapp'
 compileSdk 36
 buildToolsVersion '36.0.0'
 defaultConfig { applicationId 'de.ruhrpottguru.testapp'; minSdk 26; targetSdk 36; versionCode 20; versionName '0.17.1-test' }
 buildFeatures { compose true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 signingConfigs { debug { storeFile file('../signing/test-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 // Optimized internal test APK, signed with the existing test key for updates.
 // A production signing identity is intentionally not configured here.
 buildTypes { release {
  debuggable false
  signingConfig signingConfigs.debug
  minifyEnabled true
  shrinkResources true
  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
 } }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2025.04.01')
 implementation 'androidx.activity:activity-compose:1.10.1'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.foundation:foundation'
 implementation 'androidx.work:work-runtime:2.10.1'
 implementation 'io.coil-kt.coil3:coil-compose:3.1.0'
 implementation 'io.coil-kt.coil3:coil-network-okhttp:3.1.0'
 implementation 'io.coil-kt.coil3:coil-svg:3.1.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
